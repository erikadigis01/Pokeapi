<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="https://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{Layout}">
    
    <section class="container my-5" layout:fragment="content">
        
        <!--BREADCRUMBS-->
        <nav class="breadcrumb">
            <a href="/">Inicio</a> /
            <a href="/administrador/pokemons">Pokédex</a> /
            <span>Administrador</span>
        </nav>
        <div class="perfil-container">
            <!-- Datos del Maestro Pokémon -->
            <section class="perfil-info">
                <img src="https://static.wikia.nocookie.net/universecw/images/0/0f/Ash_Ketchum.png/revision/latest?cb=20201216120309&path-prefix=es" alt="Maestro Pokémon" class="perfil-img">
                <div class="perfil-datos">
                    <h2 class="perfil-nombre"><span th:text="${usuario.nombre}"></span></h2>
                    <div class="badges">
                        <span class="badge badge-region">Maestro Pokémon</span>
                        <span class="badge badge-region">Región: Kanto</span>
                    </div>
                    <button id="btnEditarPerfil" class="btn-social">
                        Editar Perfil
                    </button>

                </div>
                <div class="perfil-stats">
                    <div class="stat-item rojo">
                        <span class="stat-label">Batallas Ganadas</span>
                        <div class="stat-bar">
                            <div class="fill" style="width: 80%;"></div>
                        </div>
                    </div>

                    <div class="stat-item amarillo">
                        <span class="stat-label">Velocidad</span>
                        <div class="stat-bar">
                            <div class="fill" style="width: 65%;"></div>
                        </div>
                    </div>

                    <div class="stat-item azul">
                        <span class="stat-label">Pokémon Capturados</span>
                        <div class="stat-bar">
                            <div class="fill" style="width: 90%;"></div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
        <!--USUARIOS-->
        <div> 
            <form>
                <div class="row d-flex justify-content-between my-1">
                    <div class="col-8 justify-content-start text-secondary">
                        <h3 class="h-3">Usuarios</h3>
                    </div>
                </div>
            </form>

        </div>
        <div class="row justify-content-end">
            <div class="col-2 d-flex justify-content-end">
                <a type="button" class="btn btn-success"  th:href="@{/usuario/add}">
                    <i class="bi bi-plus-lg"></i>
                    Agregar
                </a>
            </div>
        </div>
        <div class="table-responsive">
            <table class=" table table-hover table-striped">
                <thead>
                    <tr>
                        <th scope="col" class="text-black-50">#Id</th>
<!--                        <th scope="col-1" class="text-black-50">Imagen</th>-->
                        <th scope="col" class="text-black-50">
                            Nombre
                        </th>
                        <th scope="col" class="text-black-50">
                            Email
                        </th>
<!--                        <th scope="col" class="text-black-50">
                            <i class="bi bi-geo-alt-fill"></i>
                            Direccion
                        </th>-->
<!--                        <th scope="col" class="text-black-50">
                            <i class="bi bi-telephone-fill"></i>
                            Contacto
                        </th>-->
<!--                        <th scope="col-1" class="text-black-50">Roll</th>
                        <th scope="col-1" class="text-black-50">Status</th>
-->                        <th scope="col" class="text-black-50">Accion</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="usuario, iterStat: ${usuarios}" >
                        <th  scope="row"><span th:text="${iterStat.index + 1}"></span></th>
<!--                        <td class="col-1">
                            <img th:src="${usuario.Imagen == null} ? 'https://mdbootstrap.com/img/Photos/Others/placeholder-avatar.jpg' : 'data:image/jpeg;base64,' + ${usuario.Imagen}"
                                 alt="Foto de perfil" class="rounded-circle" id="imagen" width="42">
                        </td>-->
                        <td class="col" th:text="|${usuario.nombre} ${usuario.apellidoPaterno}|"></td>
                        <td class="col" th:text="|${usuario.nombre} ${usuario.email}|"></td>
<!--                        <td class="col-4">
                            <ul th:each="direccion, iterStat: ${usuario.Direccion}">
                                <li th:text="|Calle: ${direccion.Calle}, Numero Interior: ${direccion.NumeroInterior}, Numero Exterior: ${direccion.NumeroExterior}, Numero Exterior: ${direccion.NumeroExterior}|"></li>
                            </ul>

                        </td>-->
<!--                        <td>
                            <ul>
                                <li>Celular: <span th:text="${usuario.Celular}"></span></li>
                                <li>Telefono: <span th:text="${usuario.Telefono}"></span></li>
                                <li>Email: <span th:text="${usuario.Email}"></span></li>
                            </ul>
                        </td>-->
<!--                        <td class="">
                            <div class="badge text-bg-secondary"><span th:text="${usuario.Roll.NombreRoll}"></span></div>
                        </td>
                        <td class="col-1">
                            <div class="form-check form-switch">
                                <input class="form-check-input status-switch" 
                                       type="checkbox" 
                                       role="switch" 
                                       id="switchCheckChecked" 
                                       th:attr="data-id=${usuario.IdUsuario}"
                                       th:checked="${usuario.Status == 1}">
                            </div>
                        </td>
                        <td class="col-1">
                            <span th:text="${usuario.IsVerified == 1 ? 'Verificado' : 'No Verificado'}"
                                th:classappend="${usuario.IsVerified == 1 ? ' badge text-bg-info' : ' badge text-bg-warning'}">
                            </span>
                        </td>-->
                        <td class=" col-3">
                            <!--th:href="@{/usuario/detail/{id}(id=${usuario.IdUsuario})}"-->
                            <a type="button" class="btn btn-primary btn-sm"> 
                                <i class="bi bi-pencil-square"></i>

                            </a>
                            <!--th:onclick="|confirmarEliminacionUsuario(${usuario.IdUsuario})|"-->
                            <button type="button" class="btn btn-danger btn-sm" 
                                    th:onclick="|confirmarEliminacionUsuario(${usuario.id})|"> 
                                <i class="bi bi-trash3-fill"></i>
                            </button>
                        </td>
                    </tr> 
                </tbody>
            </table>
        </div>
        <!-- Modal oculto -->
        <div id="modal-editar" class="modal">
            <div class="modal-content w-25">
                <span class="close">&times;</span>
                <h2>Editar Perfil</h2>
                <form th:action="@{/administrador/detail}" th:object="${usuario}" method="post">
                    <input type="hidden" name="idUsuario" th:value="${id}" th:field="*{id}" id="idUsuario">
                    <div class="form-group">
                        <label for="nombre">Nombre</label>
                        <input
                            type="text"
                            id="nombre"
                            name="nombre"
                            th:field="*{nombre}"
                            th:value="${usuario.nombre}"
                            th:placeholder="${usuario.nombre}"
                            required
                            />
                    </div>

                    <!-- Apellido Paterno -->
                    <div class="form-group">
                        <label for="apellidoPaterno">Apellido Paterno</label>
                        <input
                            type="text"
                            id="apellidoPaterno"
                            name="apellidoPaterno"
                            th:field="*{ApellidoPaterno}"
                            th:value="${usuario.ApellidoPaterno}"
                            th:placeholder="${usuario.ApellidoPaterno}"
                            required
                            />
                    </div>

                    <!-- Apellido Materno -->
                    <div class="form-group">
                        <label for="apellidoMaterno">Apellido Materno</label>
                        <input
                            type="text"
                            id="apellidoMaterno"
                            name="apellidoMaterno"
                            th:field="*{ApellidoMaterno}"
                            th:value="${usuario.ApellidoMaterno}"
                            th:placeholder="${usuario.ApellidoMaterno}"
                            required
                            />
                    </div>

                    <!-- Email -->
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            th:field="*{email}"
                            th:value="${usuario.email}"
                            th:placeholder="${usuario.email}"
                            required
                            />
                    </div>

                    <!--                 Password 
                    <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input
                                            type="password"
                                            id="password"
                                            name="password"
                                            placeholder="••••••••"
                                            required
                                            />
                    </div>-->

                    <button type="submit" class="btn-submit">Guardar</button>
                </form>
            </div>
        </div>
    </section>
</html>
