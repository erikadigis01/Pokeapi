<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Recuperar Contraseña</title>
        <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="/css/login.css">
    </head>
    <body>
        <!-- Pokeballs decorativas -->
        <div class="pokeball-deco pokeball-1"></div>
        <div class="pokeball-deco pokeball-2"></div>
        <div class="pokeball-deco pokeball-3"></div>
        <div class="pokeball-deco pokeball-4"></div>

        <div class="container container_login">
            <div class="login-wrapper">
                <!-- Header -->
                <div class="header">
                    <h1 class="titulo-pokemon">POKÉMON</h1>
                    <h2 class="titulo-login">Recuperar Contraseña</h2>
                    <p class="subtitulo">Ingresa tu correo para recibir un código</p>
                </div>
                <!-- Formulario -->
                <div class="form-container" >
                    <div class="form-border-top"></div>

                    <!-- Icono Pikachu -->
                    <form id="loginForm" th:action="@{/resetPassword}" method="post">
                        <!-- Email -->
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input 
                                type="email" 
                                id="email" 
                                name="email" 
                                placeholder="entrenador@pokemon.com" 
                                required
                                />
                        </div>
                        <!--AGREGAR UN CAMPO PARA METER EL CODIGO-->
                        <!-- Botón Submit -->
                        <button type="submit" class="btn-submit">
                            Mandar correo
                            <!--CAMBIAR EL NOMBRE DEL BOTON-->
                        </button>
                    </form>
                </div>
            </div>
        </div>
       </body>
</html>
