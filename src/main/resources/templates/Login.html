<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login Pokémon</title>
        <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="/css/login.css">
    </head>
    <body>
        <!-- Pokeballs decorativas -->
        <div class="pokeball-deco pokeball-1"></div>
        <div class="pokeball-deco pokeball-2"></div>
        <div class="pokeball-deco pokeball-3"></div>
        <div class="pokeball-deco pokeball-4"></div>

        <div class="container">
            <div class="login-wrapper">
                <!-- Header -->
                <div class="header">
                    <h1 class="titulo-pokemon">POKÉMON</h1>
                    <h2 class="titulo-login">LOGIN</h2>
                    <p class="subtitulo">¡Continúa tu aventura!</p>
                </div>
                <span th:if="${mensaje != null}" th:text="${mensaje}" class="success-message"></span>
                <span th:if="${error != null}" th:text="${error}" class="error-message"></span>
                <!-- Formulario -->
                <div class="form-container" >
                    <div class="form-border-top"></div>

                    <!-- Icono Pikachu -->
                    <div class="pikachu-icon">⚡</div>

                    <form id="loginForm" class="" th:action="@{/login}" method="post">
                        <!-- Email -->
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input 
                                type="email" 
                                id="email" 
                                name="email" 
                                placeholder="entrenador@pokemon.com" 
                                required
                                />
                        </div>

                        <!-- Password -->
                        <div class="form-group">
                            <label for="password">Contraseña</label>
                            <input 
                                type="password" 
                                id="password" 
                                name="password" 
                                placeholder="••••••••" 
                                required
                                />
                        </div>

                        <!-- Recordarme y Olvidé contraseña -->
                        <div class="checkbox-group">
                            <input type="checkbox" id="remember" name="remember" />
                            <label for="remember">Recordarme</label>
                        </div>

                        <div class="forgot-password">
                            <a href="#">¿Olvidaste tu contraseña?</a>
                        </div>
                        <span 
                            th:if="${error != null}" 
                            th:text="${error}" 
                            class="error-message">
                        </span>

                        <!-- Botón Submit -->
                        <button type="submit" class="btn-submit">
                            ¡ENTRAR!
                        </button>
                    </form>

                    <!-- Divider -->
                    <div class="divider">
                        <span>O continúa con</span>
                    </div>

                    <!-- Social Login Buttons -->
                    <div class="social-login">
                        <button class="btn-social" onclick="socialLogin('Google')">
                            🔴 Google
                        </button>
                        <button class="btn-social" onclick="socialLogin('Facebook')">
                            🔵 Facebook
                        </button>
                    </div>

                    <!-- Pokeballs decorativas footer -->
                    <div class="pokeballs-footer">
                        <div class="pokeball-mini pokeball-red">
                            <div class="pokeball-center"></div>
                        </div>
                        <div class="pokeball-mini pokeball-blue">
                            <div class="pokeball-center"></div>
                        </div>
                        <div class="pokeball-mini pokeball-yellow">
                            <div class="pokeball-center"></div>
                        </div>
                    </div>
                </div>

                <!-- Footer -->
                <p class="footer-text">
                    ¿No tienes cuenta? <a th:href="@{/login/registro}">Regístrate aquí</a>
                </p>
            </div>
        </div>
