<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login Pokémon</title>
        <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="/css/login.css">
    </head>
    <body>
        <!-- Pokeballs decorativas -->
        <div class="pokeball-deco pokeball-1"></div>
        <div class="pokeball-deco pokeball-2"></div>
        <div class="pokeball-deco pokeball-3"></div>
        <div class="pokeball-deco pokeball-4"></div>

        <div class="container container_login">
            <div class="login-wrapper">
                <!-- Header -->
                <div class="header">
                    <h1 class="titulo-pokemon">POKÉMON</h1>
                    <h2 class="titulo-login">LOGIN</h2>
                    <p class="subtitulo">¡Continúa tu aventura!</p>
                </div>
                <span th:if="${mensaje != null and mensaje != ''}"
                      th:text="${mensaje}"
                      class="success-message"></span>

                <span th:if="${error != null and error != ''}"
                      th:text="${error}"
                      class="error-message"></span>

                <span th:if="${status != null and status != ''}"
                      th:text="${status}"
                      class="error-message"></span>
                <!-- Formulario -->
                <div class="form-container" >
                    <div class="form-border-top"></div>

                    <!-- Icono Pikachu -->
                    <div class="pikachu-icon">⚡</div>
                    <form id="loginForm" class="" th:action="@{/login}" method="post">
                        <!-- Email -->
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input 
                                type="email" 
                                id="email" 
                                name="email" 
                                placeholder="entrenador@pokemon.com" 
                                th:value="${email}"
                                required
                                />
                        </div>

                        <!-- Password -->
                        <div class="form-group">
                            <label for="password">Contraseña</label>
                            <input 
                                type="password" 
                                id="password" 
                                name="password" 
                                placeholder="••••••••" 
                                required
                                />
                        </div>

                        <div th:if="${accountStatus == 'UNVERIFIED'}" class="alert alert-warning mt-3 text-center">

                            <p>Tu cuenta aún no ha sido verificada.</p>

                            <button id="btnResend"
                                    class="pk-retro-btn"
                                    onclick="reenviarVerificacion()">
                                Verificar Cuenta
                            </button>
                            <div >
                                <p id="resendMsg" class="text-success mt-2" style="display:none;">
                                    Correo enviado. Revisa tu bandeja de entrada.
                                </p>
                            </div>
                        </div>

                        <div class="forgot-password">
                            <a th:href="@{/resetPassword}">¿Olvidaste tu contraseña?</a>
                        </div>

                        <!-- Botón Submit -->
                        <button type="submit" class="btn-submit">
                            ¡ENTRAR!
                        </button>
                    </form>

                    <!-- Divider -->
                    <!--                    <div class="divider">
                                            <span>O continúa con</span>
                                        </div>-->

                    <!-- Social Login Buttons -->
                    <!--                    <div class="social-login">
                                            <button class="btn-social" onclick="socialLogin('Google')">
                                                🔴 Google
                                            </button>
                                            <button class="btn-social" onclick="socialLogin('Facebook')">
                                                🔵 Facebook
                                            </button>
                                        </div>-->

                    <!-- Pokeballs decorativas footer -->
                    <div class="pokeballs-footer">
                        <div class="pokeball-mini pokeball-red">
                            <div class="pokeball-center"></div>
                        </div>
                        <div class="pokeball-mini pokeball-blue">
                            <div class="pokeball-center"></div>
                        </div>
                        <div class="pokeball-mini pokeball-yellow">
                            <div class="pokeball-center"></div>
                        </div>
                    </div>
                </div>

                <!-- Footer -->
                <p class="footer-text">
                    ¿No tienes cuenta? <a th:href="@{/login/registro}">Regístrate aquí</a>
                </p>
            </div>
        </div>
    </body>
</html>
