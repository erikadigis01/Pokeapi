<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Perfil</title>
        <link rel="stylesheet" href="/css/perfil.css">
        <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    </head>
    <body>
        <!--HEADER-->
        <div class="header sticky-header">
            <div class="menu-bar">
                <h1 class="titulo-pokemon">Pokédex</h1>

                <div class="menu-right">
                    <button type="submit" class="btn-submit">
                        Logout
                    </button>
                </div>
            </div>
        </div>
        <!--BREADCRUMBS-->
        <nav class="breadcrumb">
            <a href="/">Inicio</a> /
            <a href="/pokedex">Pokédex</a> /
            <span>Perfil</span>
        </nav>


        <!--PERFIL POKEMON-->
        <div class="perfil-container">
            <!-- Datos del Maestro Pokémon -->
            <section class="perfil-info">
                <img src="https://static.wikia.nocookie.net/universecw/images/0/0f/Ash_Ketchum.png/revision/latest?cb=20201216120309&path-prefix=es" alt="Maestro Pokémon" class="perfil-img">
                <div class="perfil-datos">
                    <h2 class="perfil-nombre"><span th:text="${email}"></span></h2>
                    <div class="badges">
                        <span class="badge badge-region">Maestro Pokémon</span>
                        <span class="badge badge-region">Región: Kanto</span>
                    </div>
                    <button class="btn-social">
                        Editar Perfil
                    </button>
                </div>
                <div class="perfil-stats">
                    <div class="stat-item rojo">
                        <span class="stat-label">Batallas Ganadas</span>
                        <div class="stat-bar">
                            <div class="fill" style="width: 80%;"></div>
                        </div>
                    </div>

                    <div class="stat-item amarillo">
                        <span class="stat-label">Velocidad</span>
                        <div class="stat-bar">
                            <div class="fill" style="width: 65%;"></div>
                        </div>
                    </div>

                    <div class="stat-item azul">
                        <span class="stat-label">Pokémon Capturados</span>
                        <div class="stat-bar">
                            <div class="fill" style="width: 90%;"></div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
        <div class="container-2">
            <section>
                <!--CARTAS POKEMON FAVORITAS-->
                <div class="favoritos">
                    <h3>Pokémones Favoritos</h3>
                </div>
                <!-- No Results -->
                <div id="noResults" class="no-results" style="display: none;">
                    <p class="no-results-title">No se encontraron Pokémon</p>
                    <p class="no-results-text">Intenta con otro término de búsqueda o filtro</p>
                </div>

                <!-- Pokemon Grid -->
                <div id="pokemonGrid" class="pokemon-grid"></div>
            </section>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script th:src="@{/js/scriptPerfil.js}"></script>
        <!-- Modal oculto -->
        <div id="modal-editar" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2>Editar Perfil</h2>
                <form>
                    <div class="form-group">
                        <label for="nombre">Nombre</label>
                        <input
                            type="text"
                            id="nombre"
                            name="nombre"
                            placeholder="Ash"
                            required
                            />
                    </div>

                    <!-- Apellido Paterno -->
                    <div class="form-group">
                        <label for="apellidoPaterno">Apellido Paterno</label>
                        <input
                            type="text"
                            id="apellidoPaterno"
                            name="apellidoPaterno"
                            placeholder="Ketchum"
                            required
                            />
                    </div>

                    <!-- Apellido Materno -->
                    <div class="form-group">
                        <label for="apellidoMaterno">Apellido Materno</label>
                        <input
                            type="text"
                            id="apellidoMaterno"
                            name="apellidoMaterno"
                            placeholder="López"
                            required
                            />
                    </div>

                    <!-- Email -->
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="entrenador@pokemon.com"
                            required
                            />
                    </div>

                    <!-- Password -->
                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="••••••••"
                            required
                            />
                    </div>

                    <button type="submit" class="btn-submit">Guardar</button>
                </form>
            </div>
        </div>
    </body>
</html>
