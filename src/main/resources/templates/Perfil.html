<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Perfil</title>
        <link rel="stylesheet" href="/css/perfil.css">
        <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    </head>
    <body>
        <!--HEADER-->
        <div class="header sticky-header">
            <div class="menu-bar">
              <h1 class="titulo-pokemon">Pokédex</h1>

              <div class="menu-right">
               <button type="submit" class="btn-submit">
                    Logout
               </button>
              </div>
            </div>
        </div>
        <!--BREADCRUMBS-->
        <nav class="breadcrumb">
          <a href="/">Inicio</a> /
          <a href="/pokedex">Pokédex</a> /
          <span>Perfil</span>
        </nav>

        
        <!--PERFIL POKEMON-->
        <div class="perfil-container">
        <!-- Datos del Maestro Pokémon -->
        <section class="perfil-info">
          <img src="https://static.wikia.nocookie.net/universecw/images/0/0f/Ash_Ketchum.png/revision/latest?cb=20201216120309&path-prefix=es" alt="Maestro Pokémon" class="perfil-img">
          <div class="perfil-datos">
            <h2 class="perfil-nombre"><span th:text="${usuario.nombre}"></span></h2>
            <div class="badges">
                <span class="badge badge-region">Maestro Pokémon</span>
                <span class="badge badge-region">Región: Kanto</span>
              </div>
                <button class="btn-social">
                    Editar Perfil
                </button>
          </div>
          <div class="perfil-stats">
            <div class="stat-item rojo">
              <span class="stat-label">Batallas Ganadas</span>
              <div class="stat-bar">
                <div class="fill" style="width: 80%;"></div>
              </div>
            </div>

            <div class="stat-item amarillo">
              <span class="stat-label">Velocidad</span>
              <div class="stat-bar">
                <div class="fill" style="width: 65%;"></div>
              </div>
            </div>

            <div class="stat-item azul">
              <span class="stat-label">Pokémon Capturados</span>
              <div class="stat-bar">
                <div class="fill" style="width: 90%;"></div>
              </div>
            </div>
          </div>
        </section>
      </div>
        <!--CARTAS POKEMON FAVORITAS-->
        <div class="favoritos">
            <h3>Pokémones Favoritos</h3>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script th:href="@{/js/script.js}"></script>
        <!-- Modal oculto -->
        <div id="modal-editar" class="modal">
          <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Editar Perfil</h2>
            <form th:action="@{/pokedex/detail}" th:object="${usuario}" method="post">
                 <input type="hidden" name="idUsuario" th:value="${id}" th:field="*{id}" id="idUsuario">
                <div class="form-group">
                    <label for="nombre">Nombre</label>
                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        th:field="*{nombre}"
                        th:value="${usuario.nombre}"
                        th:placeholder="${usuario.nombre}"
                        required
                        />
                </div>

                <!-- Apellido Paterno -->
                <div class="form-group">
                    <label for="apellidoPaterno">Apellido Paterno</label>
                    <input
                        type="text"
                        id="apellidoPaterno"
                        name="apellidoPaterno"
                        th:field="*{ApellidoPaterno}"
                        th:value="${usuario.ApellidoPaterno}"
                        th:placeholder="${usuario.ApellidoPaterno}"
                        required
                        />
                </div>

                <!-- Apellido Materno -->
                <div class="form-group">
                    <label for="apellidoMaterno">Apellido Materno</label>
                    <input
                        type="text"
                        id="apellidoMaterno"
                        name="apellidoMaterno"
                        th:field="*{ApellidoMaterno}"
                        th:value="${usuario.ApellidoMaterno}"
                        th:placeholder="${usuario.ApellidoMaterno}"
                        required
                        />
                </div>

                <!-- Email -->
                <div class="form-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        th:field="*{email}"
                        th:value="${usuario.email}"
                        th:placeholder="${usuario.email}"
                        required
                        />
                </div>

<!--                 Password 
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="••••••••"
                        required
                        />
                </div>-->

              <button type="submit" class="btn-submit">Guardar</button>
            </form>
          </div>
        </div>
        <script th:inline="javascript">
            // Obtener elementos
            const modal = document.getElementById("modal-editar");
            const btn = document.querySelector(".btn-social");
            const span = document.querySelector(".close");

            // Abrir modal al hacer clic en el botón
            btn.onclick = function() {
              modal.style.display = "block";
            }

            // Cerrar modal al hacer clic en la X
            span.onclick = function() {
              modal.style.display = "none";
            }

            // Cerrar modal al hacer clic fuera del contenido
            window.onclick = function(event) {
              if (event.target == modal) {
                modal.style.display = "none";
              }
            }
        </script>

    </body>
</html>
