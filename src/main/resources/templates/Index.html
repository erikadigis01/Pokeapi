<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Pokédex</title>
        <link rel="stylesheet" href="/css/styles.css">
    </head>
    <body>
        <div class="container">
            <!-- Header -->
            <div class="header">
                <div class="header-content">
                    <div class="header-title">
                        <div class="pokeball">
                            <div class="pokeball-inner"></div>
                        </div>
                        <h1>Pokédex</h1>
                    </div>
                    <p class="subtitle">Descubre información sobre todos los Pokémon</p>

                    <!-- Search Bar -->
                    <div class="search-container">
                        <div class="search-wrapper">
                            <input 
                                type="text" 
                                id="searchInput" 
                                placeholder="Buscar por nombre o número..."
                                class="search-input"
                                >
                            <button id="clearSearch" class="clear-btn" style="display: none;">×</button>
                        </div>
                        <p id="searchResults" class="search-results"></p>
                    </div>
                </div>
            </div>

            <!-- Loading -->
            <div id="loading" class="loading">
                <div class="spinner"></div>
                <p>Cargando Pokémon...</p>
            </div>

            <!-- No Results -->
            <div id="noResults" class="no-results" style="display: none;">
                <p class="no-results-title">No se encontraron Pokémon</p>
                <p class="no-results-text">Intenta con otro término de búsqueda</p>
            </div>

            <!-- Pokemon Grid -->
            <div id="pokemonGrid" class="pokemon-grid"></div>

            <!-- Pagination -->
            <div id="pagination" class="pagination">
                <button id="prevBtn" class="btn-pagination">← Anterior</button>
                <span id="pageInfo" class="page-info">Página 1 de 1</span>
                <button id="nextBtn" class="btn-pagination">Siguiente →</button>
            </div>
        </div>

        <!-- Modal -->
        <div id="modal" class="modal" style="display: none;">
            <div class="modal-overlay"></div>
            <div class="modal-content">
                <button class="modal-close">×</button>
                <div id="modalBody"></div>
            </div>
        </div>

        <script src="/js/script.js"></script>
    </body>
</html>
