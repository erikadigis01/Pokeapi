<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Registro Pokémon</title>
        <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: 'Poppins', sans-serif;
                min-height: 100vh;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                position: relative;
                overflow-x: hidden;
            }

            .pokeball-deco {
                position: absolute;
                border-radius: 50%;
                opacity: 0.2;
            }

            .pokeball-1 {
                top: 40px;
                left: 40px;
                width: 80px;
                height: 80px;
                background: radial-gradient(circle at 30% 30%, #ff1744, #c41c00);
            }

            .pokeball-2 {
                bottom: 80px;
                right: 80px;
                width: 128px;
                height: 128px;
                background: radial-gradient(circle at 30% 30%, #ff1744, #c41c00);
            }

            .pokeball-3 {
                top: 50%;
                left: 20px;
                width: 64px;
                height: 64px;
                background: radial-gradient(circle at 30% 30%, #ffd600, #ffab00);
            }

            .container {
                max-width: 800px;
                margin: 0 auto;
                padding: 32px 16px;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                position: relative;
                z-index: 1;
            }

            .registro-wrapper {
                width: 100%;
            }

            .header {
                text-align: center;
                margin-bottom: 32px;
            }

            .titulo-pokemon {
                font-family: 'Press Start 2P', cursive;
                font-size: 3rem;
                color: #FFDE00;
                text-shadow: 4px 4px 0px #3B4CCA, 8px 8px 0px rgba(0,0,0,0.3);
                margin-bottom: 16px;
                line-height: 1.4;
            }

            .titulo-registro {
                font-family: 'Press Start 2P', cursive;
                font-size: 1.5rem;
                color: #ffffff;
                text-shadow: 2px 2px 0px rgba(0,0,0,0.5);
                margin-bottom: 8px;
                line-height: 1.4;
            }

            .subtitulo {
                color: white;
                font-size: 1.125rem;
            }

            .form-container {
                background: linear-gradient(180deg, #ffffff 0%, #f5f5f5 100%);
                border-radius: 24px;
                padding: 32px;
                box-shadow: 0 20px 60px rgba(0,0,0,0.4);
                position: relative;
                overflow: hidden;
            }

            .form-border-top {
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                height: 8px;
                background: linear-gradient(90deg, #FF1744 0%, #FF1744 45%, #000000 45%, #000000 55%, #FFFFFF 55%, #FFFFFF 100%);
            }

            .form-group {
                margin-bottom: 24px;
            }

            label {
                display: block;
                margin-bottom: 8px;
                color: #374151;
                font-weight: 600;
            }

            input[type="text"],
            input[type="email"],
            input[type="password"],
            select {
                width: 100%;
                padding: 12px 16px;
                border: 4px solid #d1d5db;
                border-radius: 12px;
                font-family: 'Poppins', sans-serif;
                font-size: 1rem;
                transition: border-color 0.3s;
                background: white;
            }

            input[type="text"]:focus,
            input[type="email"]:focus,
            input[type="password"]:focus,
            select:focus {
                outline: none;
                border-color: #FBBF24;
            }

            select {
                cursor: pointer;
            }

            .btn-submit {
                width: 100%;
                padding: 16px;
                background: linear-gradient(135deg, #FFDE00 0%, #FFC107 100%);
                border: 4px solid #3B4CCA;
                border-radius: 12px;
                font-family: 'Press Start 2P', cursive;
                font-size: 1rem;
                color: #3B4CCA;
                cursor: pointer;
                box-shadow: 0 8px 0 #3B4CCA, 0 12px 20px rgba(0,0,0,0.3);
                transition: transform 0.2s;
                line-height: 1.6;
            }

            .btn-submit:hover {
                transform: scale(1.05);
            }

            .btn-submit:active {
                transform: scale(0.95);
                box-shadow: 0 4px 0 #3B4CCA, 0 6px 15px rgba(0,0,0,0.3);
            }

            .pokeballs-footer {
                display: flex;
                justify-content: center;
                gap: 16px;
                margin-top: 32px;
            }

            .pokeball-mini {
                width: 32px;
                height: 32px;
                border-radius: 50%;
                border: 4px solid #000;
                position: relative;
            }

            .pokeball-red {
                background: linear-gradient(180deg, #FF1744 0%, #FF1744 50%, #FFFFFF 50%, #FFFFFF 100%);
            }

            .pokeball-blue {
                background: linear-gradient(180deg, #2196F3 0%, #2196F3 50%, #FFFFFF 50%, #FFFFFF 100%);
            }

            .pokeball-yellow {
                background: linear-gradient(180deg, #FFDE00 0%, #FFDE00 50%, #FFFFFF 50%, #FFFFFF 100%);
            }

            .pokeball-center {
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                width: 12px;
                height: 12px;
                background: white;
                border-radius: 50%;
                border: 2px solid #000;
            }

            .footer-text {
                text-align: center;
                margin-top: 24px;
                color: white;
            }

            .footer-text a {
                color: white;
                text-decoration: underline;
                transition: color 0.3s;
            }

            .footer-text a:hover {
                color: #FDE047;
            }

            @media (max-width: 768px) {
                .titulo-pokemon {
                    font-size: 2rem;
                }

                .titulo-registro {
                    font-size: 1.2rem;
                }

                .form-container {
                    padding: 24px;
                }

                .btn-submit {
                    font-size: 0.875rem;
                }
            }
        </style>
    </head>
    <body>
        <!-- Pokeballs decorativas -->
        <div class="pokeball-deco pokeball-1"></div>
        <div class="pokeball-deco pokeball-2"></div>
        <div class="pokeball-deco pokeball-3"></div>

        <div class="container">
            <div class="registro-wrapper">
                <!-- Header -->
                <div class="header">
                    <h1 class="titulo-pokemon">POKÉMON</h1>
                    <h2 class="titulo-registro">REGISTRO</h2>
                    <p class="subtitulo">¡Únete a la aventura como entrenador!</p>
                </div>

                <!-- Formulario -->
                <div class="form-container">
                    <div class="form-border-top"></div>

                    <form id="registroForm" onsubmit="handleSubmit(event)">
                        <!-- Nombre -->
                        <div class="form-group">
                            <label for="nombre">Nombre</label>
                            <input 
                                type="text" 
                                id="nombre" 
                                name="nombre" 
                                placeholder="Ash" 
                                required
                                />
                        </div>

                        <!-- Apellido Paterno -->
                        <div class="form-group">
                            <label for="apellidoPaterno">Apellido Paterno</label>
                            <input 
                                type="text" 
                                id="apellidoPaterno" 
                                name="apellidoPaterno" 
                                placeholder="Ketchum" 
                                required
                                />
                        </div>

                        <!-- Apellido Materno -->
                        <div class="form-group">
                            <label for="apellidoMaterno">Apellido Materno</label>
                            <input 
                                type="text" 
                                id="apellidoMaterno" 
                                name="apellidoMaterno" 
                                placeholder="López" 
                                required
                                />
                        </div>

                        <!-- Email -->
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input 
                                type="email" 
                                id="email" 
                                name="email" 
                                placeholder="entrenador@pokemon.com" 
                                required
                                />
                        </div>

                        <!-- Password -->
                        <div class="form-group">
                            <label for="password">Contraseña</label>
                            <input 
                                type="password" 
                                id="password" 
                                name="password" 
                                placeholder="••••••••" 
                                required
                                />
                        </div>

                        <!-- ID Rol -->
                        <div class="form-group">
                            <label for="idRol">Tipo de Usuario</label>
                            <select id="idRol" name="idRol" required>
                                <option value="user">Entrenador (Usuario)</option>
                                <option value="admin">Maestro Pokémon (Admin)</option>
                            </select>
                        </div>

                        <!-- Botón Submit -->
                        <button type="submit" class="btn-submit">
                            ¡REGISTRAR!
                        </button>
                    </form>

                    <!-- Pokeballs decorativas footer -->
                    <div class="pokeballs-footer">
                        <div class="pokeball-mini pokeball-red">
                            <div class="pokeball-center"></div>
                        </div>
                        <div class="pokeball-mini pokeball-blue">
                            <div class="pokeball-center"></div>
                        </div>
                        <div class="pokeball-mini pokeball-yellow">
                            <div class="pokeball-center"></div>
                        </div>
                    </div>
                </div>

                <!-- Footer -->
                <p class="footer-text">
                    ¿Ya tienes cuenta? <a href="#">Iniciar Sesión</a>
                </p>
            </div>
        </div>

        <script>
            function handleSubmit(event) {
                event.preventDefault();

                // Obtener los datos del formulario
                const formData = {
                    nombre: document.getElementById('nombre').value,
                    apellidoPaterno: document.getElementById('apellidoPaterno').value,
                    apellidoMaterno: document.getElementById('apellidoMaterno').value,
                    email: document.getElementById('email').value,
                    password: document.getElementById('password').value,
                    idRol: document.getElementById('idRol').value
                };

                // Mostrar en consola
                console.log('Datos del formulario:', formData);

                // Mostrar alerta de éxito
                alert('¡Registro exitoso! Bienvenido entrenador Pokémon');

                // Aquí podrías enviar los datos a un servidor
                // Por ejemplo: fetch('/api/registro', { method: 'POST', body: JSON.stringify(formData) })
            }
        </script>
    </body>
</html>
