<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Registro Pokémon</title>
        <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="/css/login.css">
     
    </head>
    <body>
        <!-- Pokeballs decorativas -->
        <div class="pokeball-deco pokeball-1"></div>
        <div class="pokeball-deco pokeball-2"></div>
        <div class="pokeball-deco pokeball-3"></div>

        <div class="container container_registro">
            <div class="registro-wrapper">
                <!-- Header -->
                <div class="header">
                    <h1 class="titulo-pokemon">POKÉMON</h1>
                    <h2 class="titulo-registro">REGISTRO</h2>
                    <p class="subtitulo">¡Únete a la aventura como entrenador!</p>
                </div>
                
                <!-- Formulario -->
                <div class="form-container">
                    <div class="form-border-top"></div>

                    <form id="registroForm" th:action="@{/login/registrar}" th:object="${usuario}" method="post">
                        <!-- Nombre -->
                        <div class="form-group">
                            <label for="nombre">Nombre</label>
                            <input 
                                type="text" 
                                id="nombre" 
                                name="nombre" 
                                placeholder="Ash" 
                                th:field="*{nombre}"
                                required
                                />
                             <span th:if="${#fields.hasErrors('nombre')}" 
                                   th:errors="*{nombre}" 
                                 class="text-danger">
                             </span>
                        </div>

                        <!-- Apellido Paterno -->
                        <div class="form-group">
                            <label for="apellidoPaterno">Apellido Paterno</label>
                            <input 
                                type="text" 
                                id="apellidoPaterno" 
                                name="apellidoPaterno" 
                                placeholder="Ketchum" 
                                th:field="*{apellidoPaterno}"
                                required
                                />
                            <span th:if="${#fields.hasErrors('apellidoPaterno')}" 
                                   th:errors="*{apellidoPaterno}" 
                                 class="text-danger">
                             </span>
                        </div>

                        <!-- Apellido Materno -->
                        <div class="form-group">
                            <label for="apellidoMaterno">Apellido Materno</label>
                            <input 
                                type="text" 
                                id="apellidoMaterno" 
                                name="apellidoMaterno" 
                                placeholder="López" 
                                th:field="*{apellidoMaterno}"
                                required
                                />
                             <span th:if="${#fields.hasErrors('apellidoMaterno')}" 
                                   th:errors="*{apellidoMaterno}" 
                                 class="text-danger">
                             </span>
                        </div>

                        <!-- Email -->
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input 
                                type="email" 
                                id="email" 
                                name="email" 
                                placeholder="entrenador@pokemon.com" 
                                th:field="*{email}"
                                required
                                />
                             <span th:if="${#fields.hasErrors('email')}" 
                                   th:errors="*{email}" 
                                 class="text-danger">
                             </span>
                        </div>

                        <!-- Password -->
                        <div class="form-group">
                            <label for="password">Contraseña</label>
                            <input 
                                type="password" 
                                id="password" 
                                name="password" 
                                th:field="*{password}"
                                placeholder="••••••••" 
                                required
                                />
                             <span th:if="${#fields.hasErrors('password')}" 
                                   th:errors="*{password}" 
                                 class="text-danger">
                             </span>
                        </div>
                        <!-- Botón Submit -->
                        <button type="submit" class="btn-submit">
                            ¡REGISTRAR!
                        </button>
                    </form>

                    <!-- Pokeballs decorativas footer -->
                    <div class="pokeballs-footer">
                        <div class="pokeball-mini pokeball-red">
                            <div class="pokeball-center"></div>
                        </div>
                        <div class="pokeball-mini pokeball-blue">
                            <div class="pokeball-center"></div>
                        </div>
                        <div class="pokeball-mini pokeball-yellow">
                            <div class="pokeball-center"></div>
                        </div>
                    </div>
                </div>

                <!-- Footer -->
                <p class="footer-text">
                    ¿Ya tienes cuenta? <a href="#">Iniciar Sesión</a>
                </p>
            </div>
        </div>

        <script>
            function handleSubmit(event) {
                event.preventDefault();

                // Obtener los datos del formulario
                const formData = {
                    nombre: document.getElementById('nombre').value,
                    apellidoPaterno: document.getElementById('apellidoPaterno').value,
                    apellidoMaterno: document.getElementById('apellidoMaterno').value,
                    email: document.getElementById('email').value,
                    password: document.getElementById('password').value,
                    idRol: document.getElementById('idRol').value
                };

                // Mostrar en consola
                console.log('Datos del formulario:', formData);

                // Mostrar alerta de éxito
                alert('¡Registro exitoso! Bienvenido entrenador Pokémon');
            }
        </script>
    </body>
</html>
