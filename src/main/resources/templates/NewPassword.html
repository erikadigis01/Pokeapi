<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Nueva Contraseña</title>
        <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="/css/login.css">
    </head>
    <body>
        <!-- Pokeballs decorativas -->
        <div class="pokeball-deco pokeball-1"></div>
        <div class="pokeball-deco pokeball-2"></div>
        <div class="pokeball-deco pokeball-3"></div>
        <div class="pokeball-deco pokeball-4"></div>

        <div class="container container_login">
            <div class="login-wrapper">
                <!-- Header -->
                <div class="header">
                    <h2 class="titulo-login">Nueva Contraseña</h2>
                    <p class="subtitulo">Ingresa tu nueva contraseña</p>
                </div>
                <span th:if="${mensaje != null}" th:text="${mensaje}" class="success-message"></span>
                <!-- Formulario -->
                <div class="form-container" >
                    <div class="form-border-top"></div>

                    <!-- Icono Pikachu -->
                    <form id="loginForm" th:action="@{/resetPassword/newPassword}" method="post">
                        <!-- Email -->
                        <input type="hidden" name="token" th:value="${token}" id="token">
                        <div class="form-group">
                            <label for="password">Contraseña</label>
                            <input 
                                type="password" 
                                id="password" 
                                name="password" 
                                placeholder="" 
                                required
                                />
                        </div>
                        <div class="form-group">
                            <label for="passwordDos">Repita Contraseña</label>
                            <input 
                                type="password" 
                                id="passwordDos" 
                                name="passwordDos" 
                                placeholder="" 
                                required
                                />
                        </div>
                        <!--FUNCION PARA VER QUE COINCIDAN LAS CONTRASEÑAS-->
                        <button type="submit" class="btn-submit">
                            Guardar Nueva Contraseña
                        </button>
                    </form>
                </div>
            </div>
        </div>
       </body>
</html>
